services:
  scadarina:
    container_name: SCADarina
    build:
      context: ./scadarina
      dockerfile: Dockerfile
    image: scadarina:latest
    restart: unless-stopped
    ports:
      - "5343:5000"
    volumes:
      - ./scadarina/models:/app/models
      - ./scadarina/libraries:/root/.local/share/OpenSCAD/libraries
    environment:
      # Options: "stable" (classic CGAL engine) or "nightly" (fast Manifold engine)
      - OPENSCAD_VERSION=stable
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/CameraRick/SCADarina/refs/heads/main/img/logo/png/scadarina_512.png"

